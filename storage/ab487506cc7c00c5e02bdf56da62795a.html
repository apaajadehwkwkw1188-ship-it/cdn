<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>FF LOBBY</title>
<style>
@import url("https://fonts.cdnfonts.com/css/made-evolve-sans");
*{box-sizing:border-box}
:root{--accent:#bdbdbd;--accent2:#8f8f8f;--text:#f1f1f1;--muted:#8d8d8d;--bg:#101010;--line:#2b2b2b}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:"MADE Evolve Sans",Arial,sans-serif}
body{min-height:100vh}
button,input{font:inherit}
button{cursor:pointer}

.nav{
  height:58px;background:#171717;border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;padding:0 16px;
}
.nav-left{display:flex;align-items:center;gap:9px;font-weight:900;font-size:17px}
.mark{
  width:31px;height:31px;border-radius:0;background:var(--accent);
  color:#111;display:grid;place-items:center;font-size:10px;font-weight:900;
}
.nav-btn{
  border:1px solid #ddd;background:#181818;border-radius:0;padding:8px 12px;
  color:#ddd;font-size:11px;font-weight:800;
}

.container{width:min(680px,100%);margin:auto;padding:16px 12px 35px}

.video-card{
  background:#181818;border:1px solid var(--line);border-radius:0;overflow:hidden;
}
.video{
  width:100%;aspect-ratio:16/9;background:#0c0c0c;position:relative;
  display:grid;place-items:center;overflow:hidden;
}
.video video{width:100%;height:100%;object-fit:cover;display:none}
.video.empty .video-placeholder{display:flex}
.video-placeholder{
  display:none;position:absolute;inset:0;align-items:center;justify-content:center;
  flex-direction:column;color:#888;font-size:11px;gap:7px;text-align:center;
}
.video-icon{
  width:42px;height:42px;border:1px solid #444;border-radius:0;
  display:grid;place-items:center;color:#ddd;font-size:14px;
}
.video-info{padding:12px 14px;border-top:1px solid var(--line)}
.video-title{font-size:13px;font-weight:900}
.video-sub{font-size:10px;color:var(--muted);margin-top:3px}
.video-url{
  margin-top:9px;width:100%;height:38px;border:1px solid #ddd;border-radius:0;
  padding:0 10px;outline:0;font-size:10px;background:#181818;
}
.video-url:focus{border-color:#888}

.profile{
  margin-top:14px;background:#181818;border:1px solid var(--line);border-radius:0;
  padding:17px;text-align:center;
}
.avatar{
  width:58px;height:58px;border-radius:0;margin:auto;
  background:#292929;color:#ccc;display:grid;place-items:center;
  font-weight:900;font-size:17px;
}
.profile-title{font-size:18px;font-weight:900;margin-top:9px}
.profile-sub{font-size:10px;color:var(--muted);margin-top:4px}

.tabs{
  margin-top:12px;background:#181818;border:1px solid var(--line);border-radius:0;
  padding:3px;display:flex;gap:3px;
}
.tab{
  flex:1;border:0;background:#181818;border-radius:0;padding:10px 5px;
  color:#777;font-size:10px;font-weight:900;
}
.tab.active{background:var(--accent);color:#fff}

.page{display:none}
.page.active{display:block}
.card{
  margin-top:12px;background:#181818;border:1px solid var(--line);border-radius:0;
  padding:15px;
}
.head{margin-bottom:13px}
.head-title{font-size:14px;font-weight:900}
.head-sub{font-size:10px;color:var(--muted);margin-top:4px;line-height:1.5}
.label{display:block;font-size:10px;font-weight:900;color:#666;margin:0 0 6px 1px}
input.name{
  width:100%;height:43px;border:1px solid #ddd;border-radius:0;padding:0 11px;
  outline:0;background:#121212;color:#eee;font-size:12px;margin-bottom:10px;
}
input.name:focus{border-color:#888}
.action{
  width:100%;height:43px;border:0;border-radius:0;background:var(--accent);
  color:#fff;font-size:11px;font-weight:900;
}
.action:active{background:#999;transform:scale(.99)}

.result{
  margin-top:12px;background:#0c0c0c;border-radius:0;overflow:hidden;
  border:1px solid #2d2d2d;display:none;
}
.result.show{display:block}
.result img{display:block;width:100%;height:auto}
.result-tools{display:none;gap:8px;margin-top:9px}
.result-tools.show{display:flex}
.download{
  flex:1;height:39px;border:0;border-radius:0;background:#303030;color:#fff;
  font-size:10px;font-weight:900;
}
.download:hover{background:#0c0c0c}
.status{text-align:center;font-size:9px;color:#888;margin-top:7px;min-height:12px}

.footer{text-align:center;color:#888;font-size:9px;margin-top:17px}
</style>
</head>
<body>

<header class="nav">
  <div class="nav-left"><div class="mark">FF</div><span>FF LOBBY</span></div>
  <button class="nav-btn" id="homeBtn">HOME</button>
</header>

<main class="container">

  <section class="video-card">
    <div class="video empty" id="videoBox">
      <video id="videoPlayer" controls playsinline></video>
      <div class="video-placeholder" id="videoPlaceholder">
        <div class="video-icon">▶</div>
        <div>Video 16:9</div>
      </div>
    </div>
    <div class="video-info">
      <div class="video-title">VIDEO</div>
      <div class="video-sub">16:9</div>
    </div>
  </section>

  <section class="profile">
    <div class="avatar">FF</div>
    <div class="profile-title">FF Lobby Generator</div>
    <div class="profile-sub">Generate lobby Free Fire dengan username kamu.</div>
  </section>

  <div class="tabs">
    <button class="tab active" data-tab="solo">FF LOBBY</button>
    <button class="tab" data-tab="duo">FF LOBBY DUO</button>
  </div>

  <section id="solo" class="page active">
    <div class="card">
      <div class="head">
        <div class="head-title">FF LOBBY</div>
        <div class="head-sub">Isi username terlebih dahulu, lalu generate lobby.</div>
      </div>
      <label class="label" for="soloName">USERNAME</label>
      <input class="name" id="soloName" placeholder="Masukkan username" autocomplete="off">
      <button class="action" id="soloBtn">GENERATE LOBBY</button>

      <div class="result" id="soloResult"></div>
      <div class="result-tools" id="soloTools">
        <button class="download" id="soloDownload">DOWNLOAD FOTO LOBBY</button>
      </div>
      <div class="status" id="soloStatus"></div>
    </div>
  </section>

  <section id="duo" class="page">
    <div class="card">
      <div class="head">
        <div class="head-title">FF LOBBY DUO</div>
        <div class="head-sub">Isi dua username untuk membuat lobby duo.</div>
      </div>

      <label class="label" for="nick1">USERNAME 1</label>
      <input class="name" id="nick1" placeholder="Masukkan username pertama" autocomplete="off">

      <label class="label" for="nick2">USERNAME 2</label>
      <input class="name" id="nick2" placeholder="Masukkan username kedua" autocomplete="off">

      <button class="action" id="duoBtn">GENERATE LOBBY DUO</button>

      <div class="result" id="duoResult"></div>
      <div class="result-tools" id="duoTools">
        <button class="download" id="duoDownload">DOWNLOAD FOTO LOBBY DUO</button>
      </div>
      <div class="status" id="duoStatus"></div>
    </div>
  </section>

  <div class="footer">FF Lobby Generator</div>
</main>

<script>
const SOLO_API="https://apii.nexadev.my.id/fakeff?usn=";
const DUO_API="https://apii.nexadev.my.id/fakeffduo?nickname1=";
const VIDEO_URL="https://files.catbox.moe/n3cmdo.mp4"; // Tempel URL video 16:9 di antara tanda kutip ini

let soloImageUrl="";
let duoImageUrl="";

function showImage(box,tools,status,url){
  box.innerHTML="";
  box.classList.add("show");
  tools.classList.remove("show");
  status.textContent="Memuat gambar...";

  const img=document.createElement("img");
  img.alt="FF Lobby";
  img.onload=()=>{
    tools.classList.add("show");
    status.textContent="Lobby berhasil dibuat.";
  };
  img.onerror=()=>{
    box.innerHTML='<div style="color:#bbb;text-align:center;padding:35px 15px;font-size:11px">Gagal memuat gambar lobby.</div>';
    status.textContent="Coba generate lagi.";
  };
  img.src=url+(url.includes("?")?"&":"?")+"cache="+Date.now();
  box.appendChild(img);
}

async function downloadImage(url,filename,status,button){
  if(!url)return;
  const old=button.textContent;
  button.textContent="MENGUNDUH...";
  button.disabled=true;

  try{
    const res=await fetch(url,{mode:"cors",cache:"no-store"});
    if(!res.ok)throw new Error("HTTP "+res.status);
    const blob=await res.blob();
    if(!blob.type.startsWith("image/"))throw new Error("Bukan gambar");
    const blobUrl=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=blobUrl;
    a.download=filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(blobUrl),1500);
    status.textContent="Foto berhasil diunduh.";
  }catch(e){
    // Direct download fallback. Tidak membuka API dengan window.location.
    const a=document.createElement("a");
    a.href=url;
    a.download=filename;
    a.target="_blank";
    a.rel="noopener";
    document.body.appendChild(a);
    a.click();
    a.remove();
    status.textContent="Jika browser tidak mengizinkan download langsung, gunakan tekan lama pada gambar lalu simpan.";
  }finally{
    button.textContent=old;
    button.disabled=false;
  }
}

function generateSolo(){
  const name=document.getElementById("soloName").value.trim();
  const result=document.getElementById("soloResult");
  const tools=document.getElementById("soloTools");
  const status=document.getElementById("soloStatus");

  if(!name){
    result.classList.add("show");
    result.innerHTML='<div style="color:#ffb0b0;text-align:center;padding:25px 10px;font-size:11px">Username wajib diisi.</div>';
    tools.classList.remove("show");
    status.textContent="";
    document.getElementById("soloName").focus();
    return;
  }

  soloImageUrl=SOLO_API+encodeURIComponent(name);
  showImage(result,tools,status,soloImageUrl);
}

function generateDuo(){
  const a=document.getElementById("nick1").value.trim();
  const b=document.getElementById("nick2").value.trim();
  const result=document.getElementById("duoResult");
  const tools=document.getElementById("duoTools");
  const status=document.getElementById("duoStatus");

  if(!a||!b){
    result.classList.add("show");
    result.innerHTML='<div style="color:#ffb0b0;text-align:center;padding:25px 10px;font-size:11px">Kedua username wajib diisi.</div>';
    tools.classList.remove("show");
    status.textContent="";
    (!a?document.getElementById("nick1"):document.getElementById("nick2")).focus();
    return;
  }

  duoImageUrl=DUO_API+encodeURIComponent(a)+"&nickname2="+encodeURIComponent(b);
  showImage(result,tools,status,duoImageUrl);
}

document.querySelectorAll(".tab").forEach(tab=>{
  tab.addEventListener("click",()=>{
    document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
    document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));
    tab.classList.add("active");
    document.getElementById(tab.dataset.tab).classList.add("active");
  });
});

document.getElementById("soloBtn").addEventListener("click",generateSolo);
document.getElementById("duoBtn").addEventListener("click",generateDuo);

document.getElementById("soloDownload").addEventListener("click",()=>{
  downloadImage(soloImageUrl,"ff-lobby.png",document.getElementById("soloStatus"),document.getElementById("soloDownload"));
});
document.getElementById("duoDownload").addEventListener("click",()=>{
  downloadImage(duoImageUrl,"ff-lobby-duo.png",document.getElementById("duoStatus"),document.getElementById("duoDownload"));
});

function loadEmbeddedVideo(){
  const box=document.getElementById("videoBox");
  const video=document.getElementById("videoPlayer");
  if(!VIDEO_URL){
    video.style.display="none";
    box.classList.add("empty");
    return;
  }
  video.src=VIDEO_URL;
  video.style.display="block";
  box.classList.remove("empty");
  video.muted=true;
  video.autoplay=true;
  video.loop=true;
  video.playsInline=true;
  video.load();
  video.play().catch(()=>{});
}
loadEmbeddedVideo();

document.getElementById("homeBtn").addEventListener("click",()=>window.scrollTo({top:0,behavior:"smooth"}));
</script>
</body>
</html>
