<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat Gratis - Tanpa API Key</title>
    
    <!-- Puter.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/puter-js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .chat-container {
            width: 100%;
            max-width: 600px;
            height: 80vh;
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* HEADER */
        .chat-header {
            background: linear-gradient(135deg, #0f3460, #16213e);
            color: white;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 45px;
            height: 45px;
            background: #e94560;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: bold;
        }

        .header-info h3 {
            font-size: 16px;
            margin-bottom: 2px;
        }

        .header-info p {
            font-size: 12px;
            opacity: 0.8;
        }

        .badge {
            display: inline-block;
            background: #00c853;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 5px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* AREA CHAT */
        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: #f5f6fa;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            display: flex;
            gap: 10px;
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message.ai {
            justify-content: flex-start;
        }

        .bubble {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .message.user .bubble {
            background: #0f3460;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.ai .bubble {
            background: white;
            color: #333;
            border: 1px solid #e0e0e0;
            border-bottom-left-radius: 4px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .message.ai .avatar-mini {
            width: 32px;
            height: 32px;
            background: #e94560;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: bold;
            flex-shrink: 0;
        }

        .typing-indicator {
            display: flex;
            gap: 5px;
            padding: 8px 0;
        }

        .typing-indicator span {
            width: 8px;
            height: 8px;
            background: #999;
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }

        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 60%, 100% { opacity: 0.3; transform: scale(1); }
            30% { opacity: 1; transform: scale(1.3); }
        }

        .error-bubble {
            background: #ffe0e0 !important;
            color: #c0392b !important;
            border: 1px solid #e74c3c !important;
        }

        /* INPUT AREA */
        .chat-input-area {
            display: flex;
            padding: 15px 20px;
            background: white;
            border-top: 1px solid #eee;
            gap: 10px;
        }

        .chat-input-area input {
            flex: 1;
            padding: 12px 18px;
            border: 2px solid #e0e0e0;
            border-radius: 30px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }

        .chat-input-area input:focus {
            border-color: #0f3460;
        }

        .btn-send {
            width: 45px;
            height: 45px;
            background: #0f3460;
            color: white;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
            transition: all 0.3s;
            flex-shrink: 0;
        }

        .btn-send:hover {
            background: #e94560;
            transform: scale(1.05);
        }

        .btn-send:active {
            transform: scale(0.95);
        }

        .btn-send:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        /* SCROLLBAR CUSTOM */
        .chat-messages::-webkit-scrollbar {
            width: 5px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: #f5f6fa;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: #ccc;
            border-radius: 10px;
        }

        /* RESPONSIVE */
        @media (max-width: 480px) {
            .chat-container {
                height: 90vh;
                border-radius: 0;
            }
            body {
                padding: 0;
            }
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <!-- HEADER -->
        <div class="chat-header">
            <div class="avatar">🤖</div>
            <div class="header-info">
                <h3>AI Gratis</h3>
                <p><span class="badge"></span> Online • Tanpa API Key</p>
            </div>
        </div>

        <!-- MESSAGES -->
        <div class="chat-messages" id="chatMessages">
            <div class="message ai">
                <div class="avatar-mini">🤖</div>
                <div class="bubble">
                    Halo! 👋 Aku AI gratis tanpa API Key. Tanya apa aja ya!
                </div>
            </div>
        </div>

        <!-- INPUT -->
        <div class="chat-input-area">
            <input 
                type="text" 
                id="userInput" 
                placeholder="Ketik pertanyaanmu di sini..."
                autocomplete="off"
            >
            <button class="btn-send" id="btnSend" onclick="kirimPesan()">
                ➤
            </button>
        </div>
    </div>

    <script>
        const chatMessages = document.getElementById('chatMessages');
        const userInput = document.getElementById('userInput');
        const btnSend = document.getElementById('btnSend');

        // Enter untuk kirim
        userInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                kirimPesan();
            }
        });

        function scrollKeBawah() {
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function tambahPesan(pengirim, teks, isError = false) {
            const div = document.createElement('div');
            div.classList.add('message', pengirim);

            if (pengirim === 'ai') {
                const avatar = document.createElement('div');
                avatar.classList.add('avatar-mini');
                avatar.textContent = '🤖';
                div.appendChild(avatar);
            }

            const bubble = document.createElement('div');
            bubble.classList.add('bubble');
            if (isError) bubble.classList.add('error-bubble');
            bubble.textContent = teks;

            div.appendChild(bubble);
            chatMessages.appendChild(div);
            scrollKeBawah();
        }

        function tambahTyping() {
            const div = document.createElement('div');
            div.classList.add('message', 'ai');
            div.id = 'typingIndicator';

            const avatar = document.createElement('div');
            avatar.classList.add('avatar-mini');
            avatar.textContent = '🤖';
            div.appendChild(avatar);

            const bubble = document.createElement('div');
            bubble.classList.add('bubble');
            bubble.innerHTML = `
                <div class="typing-indicator">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            `;

            div.appendChild(bubble);
            chatMessages.appendChild(div);
            scrollKeBawah();
        }

        function hapusTyping() {
            const typing = document.getElementById('typingIndicator');
            if (typing) typing.remove();
        }

        async function kirimPesan() {
            const teks = userInput.value.trim();
            if (!teks) return;

            // Tampilkan pesan user
            tambahPesan('user', teks);

            // Kosongkan input
            userInput.value = '';
            btnSend.disabled = true;
            userInput.disabled = true;

            // Tampilkan indikator mengetik
            tambahTyping();

            try {
                // PANGGIL PUTER AI TANPA API KEY!
                const jawaban = await puter.ai.chat(teks);

                // Hapus typing
                hapusTyping();

                // Tampilkan jawaban
                tambahPesan('ai', jawaban);

            } catch (error) {
                hapusTyping();
                console.error('Error:', error);
                tambahPesan('ai', '⚠️ Maaf, terjadi kesalahan. Coba lagi ya.', true);
            }

            // Aktifkan kembali input
            btnSend.disabled = false;
            userInput.disabled = false;
            userInput.focus();
        }

        // Fokus ke input saat halaman dimuat
        window.onload = function() {
            userInput.focus();
        };
    </script>

</body>
</html>
